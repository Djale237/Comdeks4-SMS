<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulateur USSD COMDEKS4</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .phone-container {
      width: 380px;
      background: #1e293b;
      border: 12px solid #334155;
      border-radius: 40px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .phone-header {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Écran USSD style Smartphone moderne */
    .screen {
      background: #f8fafc;
      color: #0f172a;
      min-height: 220px;
      border-radius: 16px;
      padding: 20px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.6;
      white-space: pre-line;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
      border: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: left;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 2px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }

    /* Animation des boutons au survol */
    .btn {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    /* Effet léger au glissement du curseur */
    .btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .btn-start {
      background: #10b981;
      color: white;
    }

    .btn-start:hover {
      background: #059669;
    }

    .btn-send {
      background: #3b82f6;
      color: white;
    }

    .btn-send:hover {
      background: #2563eb;
    }

    .btn-cancel {
      width: 100%;
      margin-top: 10px;
      background: #ef4444;
      color: white;
    }

    .btn-cancel:hover {
      background: #dc2626;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="phone-header">📞 Service USSD COMDEKS4</div>

    <div id="screen" class="screen">
      Composez le code USSD pour démarrer.
    </div>

    <!-- Formulaire de départ (Lancer session) -->
    <form id="start-form" class="form-group">
      <input type="text" id="phone" value="+237600000000" placeholder="Numéro de téléphone" required>
      <input type="text" id="serviceCode" value="*384#" placeholder="Code USSD (ex: *384#)" required>
      <button type="submit" class="btn btn-start">Lancer l'appel (*384#)</button>
    </form>

    <!-- Formulaire interactif de session -->
    <div id="session-controls" class="form-group" style="display: none;">
      <form id="choice-form" class="input-row">
        <input type="text" id="userInput" placeholder="Votre choix (ex: 1)" autofocus autocomplete="off">
        <button type="submit" class="btn btn-send">Envoyer</button>
      </form>
      <button id="btn-cancel" class="btn btn-cancel">Annuler / Raccrocher</button>
    </div>
  </div>

  <script src="ussd.js"></script>
</body>
</html>
